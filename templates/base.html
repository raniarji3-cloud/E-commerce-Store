{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>ShopAZ</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}?v=3">

</head>

<body>

{% if request.path != '/login/' and request.path != '/signup/' %}

<nav class="navbar">

    <div class="logo">
        🛍 ShopAZ
    </div>

    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'cart' %}">
                Cart
            </a>

            <a href="{% url 'orders' %}">
                Orders
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% endif %}

    </div>

</nav>

{% endif %}

{% block content %}
{% endblock %}

</body>
</html>
