{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="auth-page">

    <div class="auth-container">
        
        <div class="auth-card">

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Login to continue shopping with ShopAZ
            </p>
    
            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    placeholder="Username or Email"
                    class="auth-input"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    class="auth-input"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>
            <p class="continue-text">
                Continue with
            </p>

            <div class="social-icons">

                <a href="#" class="icon-btn">
                    <img src="{% static 'images/google.png' %}">
                </a>

                <a href="#" class="icon-btn">
                    <img src="{% static 'images/apple.png' %}">
                </a>

                <a href="#" class="icon-btn">
                    <img src="{% static 'images/facebook.png' %}">
                </a>

            </div>

            <p class="auth-footer">
                Don't have an account?
                <a href="{% url 'signup' %}">
                    Sign Up
                </a>
            </p>

    
        </div>
    </div>

</div>

{% endblock %}
